name: CONNY AI V13 Windows Build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "CONNY-WINDOWS-V13-20260904-223833/requirements.txt") {
            pip install -r "CONNY-WINDOWS-V13-20260904-223833/requirements.txt"
          }
          pip install pyinstaller

      - name: Build CONNY AI
        shell: pwsh
        run: |
          Set-Location "CONNY-WINDOWS-V13-20260904-223833"

          if (Test-Path "CONNY_AI.spec") {
            pyinstaller --clean --noconfirm "CONNY_AI.spec"
          }
          elseif (Test-Path "conny.spec") {
            pyinstaller --clean --noconfirm "conny.spec"
          }
          else {
            pyinstaller --clean --noconfirm --onefile --windowed `
              --name "CONNY AI V13" `
              windows_entry.py
          }

      - name: Locate executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "CONNY-WINDOWS-V13-20260904-223833/dist" `
            -Filter "*.exe" -Recurse | Select-Object -First 1

          if (-not $exe) {
            Write-Error "No Windows EXE was produced."
            exit 1
          }

          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          Copy-Item $exe.FullName "release/CONNY-AI-V13-Windows.exe"

          Write-Host "Windows executable:"
          Get-Item "release/CONNY-AI-V13-Windows.exe" | Format-List Name,Length,FullName

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: CONNY-AI-V13-Windows
          path: release/CONNY-AI-V13-Windows.exe
          if-no-files-found: error
