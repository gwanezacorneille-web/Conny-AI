<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONNY AI V14</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
        }

        #auth {
            max-width: 420px;
            margin: 12vh auto;
            padding: 30px;
            background: #1d1d1d;
            border-radius: 16px;
        }

        #auth input,
        #auth button {
            width: 100%;
            box-sizing: border-box;
            margin-top: 10px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
        }

        #auth button {
            cursor: pointer;
        }

        #chatApp {
            display: none;
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        #chat {
            min-height: 500px;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 12px;
            overflow-y: auto;
        }

        #message {
            width: 80%;
            padding: 12px;
        }

        #send {
            padding: 12px;
        }
    </style>
</head>

<body>

<section id="auth">
    <h1>♛ CONNY AI V14</h1>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="registerAccount()">Create Account</button>
    <button onclick="login()">Sign In</button>
    <button onclick="guestLogin()">Continue as Guest</button>

    <p id="authStatus"></p>
</section>

<section id="chatApp">
    <h1>♛ CONNY AI V14</h1>

    <button onclick="logout()">Logout</button>

    <p id="identity"></p>

    <div id="chat"></div>

    <br>

    <input id="message" placeholder="Message CONNY AI">
    <button id="send" onclick="sendMessage()">Send</button>
</section>

<script src="app.js"></script>

</body>
</html>
